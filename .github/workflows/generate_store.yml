name: Generate Store Catalog

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    
    # ADD THESE TWO LINES FOR WRITE PERMISSIONS:
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Catalog Script
        run: python generate_store.py

      - name: Commit and Push Spawned Folders
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add dist/
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated update: Spawned catalog distribution folders"
            git push
          else
            echo "No changes detected in app catalog."
          fi
